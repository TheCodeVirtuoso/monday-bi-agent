# Render blueprint. Deploy with: New -> Blueprint -> point at this repo.
# Secrets are marked sync:false so Render prompts for them instead of
# reading them from the repo — never commit a real key.
services:
  - type: web
    name: monday-bi-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      # Read the live monday.com boards, not the workbooks in data/.
      # Set USE_MOCK_DATA=true only to demo without monday credentials.
      - key: USE_MOCK_DATA
        value: "false"
      - key: MONDAY_API_TOKEN
        sync: false
      # Board ids are identifiers, not secrets — kept here so a deploy needs
      # only the two tokens pasted in.
      - key: MONDAY_DEALS_BOARD_ID
        value: "5030967679"
      - key: MONDAY_WORK_ORDERS_BOARD_ID
        value: "5030967902"
